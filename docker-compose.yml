services:
  postgres:
    image: postgres:16
    container_name: lapabook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lapabook
      POSTGRES_USER: brodit
      POSTGRES_PASSWORD: TYtB39f5FBO5UTJEiaFr6vj76MpS7llm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Keep internal only (no ports) - app accesses via docker network

  app:
    build: .
    container_name: lapabook-app
    depends_on:
      - postgres
    env_file:
      - .env.local
    environment:
      # Override host for docker network (localhost inside container -> postgres service)
      DATABASE_URL: postgresql://brodit:TYtB39f5FBO5UTJEiaFr6vj76MpS7llm@postgres:5432/lapabook
      POSTGRES_URL: postgresql://brodit:TYtB39f5FBO5UTJEiaFr6vj76MpS7llm@postgres:5432/lapabook
      IS_TESTING: "true"
      DISABLE_RATE_LIMIT: "true"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
